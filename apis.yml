aid: limit-break
name: Limit Break
description: Limit Break Inc. is a gaming and onchain-economy company that builds the Apptoken protocol suite — a
  family of permissionlessly deployable EVM smart contract protocols for programmable digital economies. Its Creator
  Token Standards (ERC-20C, ERC-721C, ERC-1155C) route every transfer through an on-chain Transfer Validator so creators
  can bind modular rulesets, operator whitelists and blacklists without changing their token contract. Around that
  foundation Limit Break ships Payment Processor for royalty-enforced NFT trading, TokenMaster for backed fungible
  tokens with pool-based buy/sell/spend flows, the Limit Break AMM with a multi-tier hook system, PermitC for time-bound
  token approvals, Wrapped Native as a gas-efficient WETH9 replacement, and Trusted Forwarder for application attribution.
  Integration is documented at apptokens.com, distributed as Solidity via Foundry and npm, and supported by 25 first-party
  AI agent skills. Limit Break is backed by Paradigm.
